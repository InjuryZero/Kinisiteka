<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery</title>
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#2b2b2b;--text:#f5f5f5;--muted:#a6a6a6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{width:min(680px,100%);display:grid;gap:1rem}.brand{text-align:center;color:var(--muted);font-size:.9rem;letter-spacing:.12em;text-transform:uppercase}.card{display:grid;gap:1rem;padding:1.5rem;border:1px solid var(--border);border-radius:22px;background:var(--surface)}h1,p{margin:0}h1{font-size:clamp(1.5rem,4vw,2.2rem)}p{color:var(--muted)}.access-options{display:flex;justify-content:center;align-items:center;gap:1.25rem;margin-top:1rem}.access-options a{position:relative;color:var(--text);text-decoration:none;font-size:.95rem;font-weight:700;letter-spacing:.08em;padding:.9rem 1.25rem;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.025));box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.12);transition:transform .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease}.access-options a:hover{color:#fff;text-decoration:none;transform:translateY(-2px);border-color:rgba(255,255,255,.42);background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.06));box-shadow:0 12px 28px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.18)}.access-options a:active{transform:translateY(0)}
</style>
</head>
<body>
<main class="wrap"><div class="brand">Recovery</div><section class="card"><h1>Bienvenido a Recovery</h1><p>Plataforma de seguimiento y apoyo para pacientes.</p><div class="access-options"><a href="clinica.html">CLÍNICA</a><a href="paciente.html">PACIENTE</a></div></section></main>
</body>
</html>
