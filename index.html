<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recovery | Plataforma premium de fisioterapia</title>

  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --surface-2: #ededed;
      --border: #d9d9d9;
      --text: #0f0f0f;
      --muted: #5c5c5c;
      --inverse: #ffffff;
      --accent: #000000;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-sm: 0 8px 24px rgba(0,0,0,.06);
      --shadow-md: 0 16px 40px rgba(0,0,0,.08);
      --transition: 180ms cubic-bezier(.16,1,.3,1);

      --text-xs: clamp(0.75rem, 0.72rem + 0.12vw, 0.82rem);
      --text-sm: clamp(0.88rem, 0.84rem + 0.2vw, 0.98rem);
      --text-base: clamp(1rem, 0.97rem + 0.2vw, 1.08rem);
      --text-lg: clamp(1.15rem, 1.05rem + 0.5vw, 1.45rem);
      --text-xl: clamp(1.45rem, 1.2rem + 0.9vw, 2rem);

      --space-2: .5rem;
      --space-3: .75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Satoshi', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow: hidden;
    }

    button, input, select, textarea { font: inherit; }
    a { color: inherit; text-decoration: none; }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: #fff;
      padding: var(--space-8);
      display: flex;
      flex-direction: column;
      gap: var(--space-8);
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .9rem;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #000;
      display: grid;
      place-items: center;
      color: #fff;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .brand-text p {
      font-size: var(--text-xs);
      color: var(--muted);
    }

    .nav {
      display: grid;
      gap: .5rem;
    }

    .nav button {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 1rem 1rem;
      border-radius: 14px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: .9rem;
      transition: all var(--transition);
      min-height: 48px;
      cursor: pointer;
    }

    .nav button:hover { background: var(--surface); }
    .nav button.active { background: #000; color: #fff; }

    .nav-icon {
      width: 18px;
      height: 18px;
      border: 1.6px solid currentColor;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .sidebar-card {
      margin-top: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
    }

    .sidebar-card h3 {
      font-size: var(--text-sm);
      margin-bottom: .35rem;
    }

    .sidebar-card p {
      color: var(--muted);
      font-size: var(--text-xs);
      margin-bottom: 1rem;
    }

    .sidebar-card .btn { width: 100%; }

    .main {
      overflow-y: auto;
      background: #fff;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
    }

    .topbar h2 {
      font-size: var(--text-lg);
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .topbar p {
      font-size: var(--text-xs);
      color: var(--muted);
    }

    .topbar-actions {
      display: flex;
      gap: .8rem;
      align-items: center;
    }

    .search {
      min-width: 280px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 999px;
      padding: .9rem 1rem;
      color: var(--text);
      outline: none;
    }

    .page {
      padding: 2rem;
      display: none;
      gap: 1.5rem;
    }

    .page.active { display: grid; }

    .hero {
      display: grid;
      grid-template-columns: 1.4fr .8fr;
      gap: 1.25rem;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .panel-dark {
      background: #000;
      color: #fff;
      border: 1px solid #000;
      box-shadow: var(--shadow-md);
    }

    .eyebrow {
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--muted);
      margin-bottom: .8rem;
    }

    .panel-dark .eyebrow { color: rgba(255,255,255,.68); }

    .headline {
      font-size: var(--text-xl);
      line-height: 1.05;
      letter-spacing: -.04em;
      max-width: 14ch;
      margin-bottom: 1rem;
      font-weight: 800;
    }

    .subtext {
      font-size: var(--text-base);
      color: var(--muted);
      max-width: 56ch;
    }

    .panel-dark .subtext { color: rgba(255,255,255,.78); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .stat {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      background: var(--surface);
    }

    .stat strong {
      display: block;
      font-size: 1.6rem;
      letter-spacing: -.03em;
      margin-bottom: .25rem;
    }

    .stat span {
      font-size: var(--text-xs);
      color: var(--muted);
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 1.25rem;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .section-title h3 {
      font-size: var(--text-lg);
      letter-spacing: -.02em;
    }

    .section-title p {
      color: var(--muted);
      font-size: var(--text-sm);
    }

    .btn {
      border: 1px solid #000;
      background: #000;
      color: #fff;
      padding: .9rem 1.15rem;
      border-radius: 999px;
      font-size: var(--text-sm);
      font-weight: 600;
      transition: all var(--transition);
      cursor: pointer;
      min-height: 44px;
    }

    .btn:hover { background: #111; }
    .btn-secondary { background: #fff; color: #000; border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface); }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .field { display: grid; gap: .45rem; }
    .field.full { grid-column: 1 / -1; }

    .field label {
      font-size: var(--text-xs);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 14px;
      padding: .95rem 1rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    .field textarea { resize: vertical; min-height: 120px; }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #000;
      box-shadow: 0 0 0 4px rgba(0,0,0,.08);
    }

    .records { display: grid; gap: 1rem; }

    .record {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      background: var(--surface);
      display: grid;
      gap: .7rem;
    }

    .record-top {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
    }

    .record h4 { font-size: 1rem; margin-bottom: .2rem; }
    .record p { font-size: var(--text-sm); color: var(--muted); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .5rem .75rem;
      border-radius: 999px;
      border: 1px solid #000;
      background: #000;
      color: #fff;
      font-size: var(--text-xs);
      font-weight: 700;
      white-space: nowrap;
    }

    .record-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      color: var(--muted);
      font-size: var(--text-xs);
    }

    .zones {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .9rem;
    }

    .zone-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 18px;
      padding: 1rem;
      text-align: left;
      min-height: 64px;
      transition: all var(--transition);
      cursor: pointer;
    }

    .zone-btn:hover {
      background: var(--surface);
      transform: translateY(-1px);
    }

    .zone-btn.active { background: #000; color: #fff; border-color: #000; }

    .zone-btn strong {
      display: block;
      font-size: var(--text-sm);
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .video-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #fff;
      box-shadow: var(--shadow-sm);
    }

    .video-placeholder {
      aspect-ratio: 16 / 9;
      background: var(--surface);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
    }

    .video-placeholder-inner {
      display: grid;
      gap: .65rem;
      justify-items: center;
    }
