<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recovery | Inicio</title>
<style>
:root{--bg:#0a0a0a;--surface:#111;--surface2:#181818;--surface3:#202020;--border:#2b2b2b;--text:#f5f5f5;--muted:#a6a6a6;--radius:22px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;display:grid;place-items:center;padding:1rem}.wrap{width:min(680px,100%);display:grid;gap:1rem}.brand{text-align:center;color:var(--muted);font-size:.9rem;letter-spacing:.12em;text-transform:uppercase}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;display:grid;gap:1rem}.card h1{margin:0;font-size:clamp(1.5rem,4vw,2.2rem)}.copy{color:var(--muted);margin:0}.btn{min-height:44px;border-radius:999px;padding:.8rem 1rem;border:1px solid var(--border);background:#fff;color:#000;font-weight:700;cursor:pointer}.btn-secondary{background:transparent;color:var(--text)}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">Recovery</div>
<section class="card">
<h1>Bienvenido a Recovery</h1>
<p class="copy">Plataforma de seguimiento y apoyo para pacientes.</p>
<div style="display:grid;gap:.7rem">
<a class="btn" href="clinica.html">Acceso clínica</a>
<a class="btn btn-secondary" href="paciente.html">Acceso paciente</a>
</div>
</section>
</main>
</body>
</html>
