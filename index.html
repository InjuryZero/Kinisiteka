<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recovery | Acceso</title>
<style>
:root{--bg:#0a0a0a;--surface:#111;--surface2:#181818;--border:#2b2b2b;--text:#f5f5f5;--muted:#a6a6a6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;display:grid;place-items:center;padding:1rem}.wrap{width:min(720px,100%);display:grid;gap:1.2rem}.brand{text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.15em}.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:1.5rem;display:grid;gap:1rem}.card h1,.card h2{margin:0}.copy{color:var(--muted);margin:0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.choice{min-height:150px;text-align:left;border:1px solid var(--border);border-radius:18px;background:var(--surface2);color:var(--text);padding:1.2rem;cursor:pointer}.choice:hover{background:#222}.choice strong{display:block;font-size:1.15rem;margin-bottom:.5rem}.choice span{color:var(--muted)}.panel{display:none;gap:1rem}.panel.open{display:grid}.field{display:grid;gap:.45rem}.field label{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.field input{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:14px;padding:1rem;outline:none}.actions{display:flex;gap:.7rem;flex-wrap:wrap}.btn{min-height:44px;border-radius:999px;padding:.8rem 1rem;border:1px solid var(--border);background:#fff;color:#000;font-weight:700;cursor:pointer}.secondary{background:transparent;color:var(--text)}.status{display:none;padding:.9rem;border:1px solid var(--border);border-radius:14px;color:#ffd7d7;background:rgba(255,215,215,.08)}.status.show{display:block}@media(max-width:600px){.choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">Recovery</div>
<section class="card" id="selector"><h1>¿Cómo quieres acceder?</h1><p class="copy">Selecciona el tipo de acceso que corresponde.</p><div class="choices"><button class="choice" id="clinicChoice"><strong>Soy clínica</strong><span>Gestionar pacientes, chats y ejercicios.</span></button><button class="choice" id="patientChoice"><strong>Soy paciente</strong><span>Acceder a mi chat con un código.</span></button></div></section>
<section class="card panel" id="clinicPanel"><h2>Acceso para clínicas</h2><p class="copy">Inicia sesión o crea una cuenta de Recovery.</p><div id="clinicStatus" class="status"></div><div class="field"><label>Email</label><input id="clinicEmail" type="email" placeholder="centro@clinica.com"></div><div class="field"><label>Contraseña</label><input id="clinicPassword" type="password" placeholder="Mínimo 6 caracteres"></div><div class="actions"><button class="btn" id="clinicLogin">Iniciar sesión</button><button class="btn secondary" id="clinicRegister">Registrarse</button><button class="btn secondary" id="backClinic">Volver</button></div></section>
<section class="card panel" id="patientPanel"><h2>Acceso para pacientes</h2><p class="copy">Introduce el código proporcionado por tu clínica.</p><div id="patientStatus" class="status"></div><div class="field"><label>Código de acceso</label><input id="patientCode" placeholder="RCV-XXXXXXXXXXXX" autocomplete="one-time-code"></div><div class="actions"><button class="btn" id="patientAccess">Acceder</button><button class="btn secondary" id="backPatient">Volver</button></div></section>
</main>
<script>
const supabaseClient=window.supabase?.createClient?.('https://yvkamsbqysxgqycrklkk.supabase.co','sb_publishable_ad6mFCc8LZN3Ua1yEgMwIA_moH8Ekzk');const $=id=>document.getElementById(id);function openPanel(id){$('selector').style.display='none';$('clinicPanel').classList.toggle('open',id==='clinicPanel');$('patientPanel').classList.toggle('open',id==='patientPanel')}function showStatus(id,text){$(id).textContent=text;$(id).classList.add('show')}function clearStatus(id){$(id).classList.remove('show')}function goClinic(){location.href='clinica.html'}function goPatient(){location.href='paciente.html'}$('clinicChoice').addEventListener('click',()=>openPanel('clinicPanel'));$('patientChoice').addEventListener('click',()=>openPanel('patientPanel'));$('backClinic').addEventListener('click',()=>{clearStatus('clinicStatus');$('selector').style.display='grid';$('clinicPanel').classList.remove('open')});$('backPatient').addEventListener('click',()=>{clearStatus('patientStatus');$('selector').style.display='grid';$('patientPanel').classList.remove('open')});$('clinicLogin').addEventListener('click',async()=>{clearStatus('clinicStatus');const email=$('clinicEmail').value.trim().toLowerCase();const password=$('clinicPassword').value;if(!email||!password){showStatus('clinicStatus','Introduce email y contraseña.');return}const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){showStatus('clinicStatus',error.message);return}goClinic()});$('clinicRegister').addEventListener('click',async()=>{clearStatus('clinicStatus');const email=$('clinicEmail').value.trim().toLowerCase();const password=$('clinicPassword').value;if(!email||!password){showStatus('clinicStatus','Introduce email y contraseña.');return}const {data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin}});if(error){showStatus('clinicStatus',error.message);return}if(!data.session){showStatus('clinicStatus','Cuenta creada. Revisa tu email para confirmar la cuenta.');return}goClinic()});$('patientAccess').addEventListener('click',async()=>{clearStatus('patientStatus');const code=$('patientCode').value.trim().toUpperCase();if(!code){showStatus('patientStatus','Introduce el código de acceso.');return}const {data,error}=await supabaseClient.rpc('validate_patient_access_code',{p_code:code});if(error){showStatus('patientStatus',error.message);return}if(!data||!data.length){showStatus('patientStatus','Código incorrecto, caducado o revocado.');return}sessionStorage.setItem('recovery_patient_access',JSON.stringify(data[0]));goPatient()})
</script>
</body>
</html>
