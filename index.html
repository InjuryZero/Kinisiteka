<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinisiteca</title>
  <meta name="description" content="Biblioteca premium de ejercicios para fisioterapia, rehabilitación y rendimiento." />

  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0b0b;
      --surface: #121212;
      --surface-2: #171717;
      --surface-3: #1d1d1d;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --text: #f4f1ea;
      --muted: rgba(244,241,234,0.72);
      --soft: rgba(244,241,234,0.52);
      --accent: #80d2ea;
      --accent-dark: #5ab7d3;
      --shadow: 0 20px 60px rgba(0,0,0,0.32);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --max-width: 1280px;
      --font-body: "Satoshi", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img,
    video {
      display: block;
      max-width: 100%;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    .container {
      width: min(var(--max-width), calc(100% - 32px));
      margin: 0 auto;
    }

    .hero-clean {
      padding: 84px 0 28px;
    }

    .hero-clean__inner {
      max-width: 980px;
    }

    .hero-clean__title {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 5.3rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 700;
      color: var(--text);
    }

    .hero-clean__subtitle {
      margin: 18px 0 0;
      max-width: 760px;
      font-size: clamp(1rem, 1.3vw, 1.15rem);
      line-height: 1.65;
      color: var(--muted);
    }

    .search-panel {
      margin-top: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .search-grid {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: 14px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 0.84rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--soft);
      font-weight: 500;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 52px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 14px;
      padding: 0 16px;
      outline: none;
    }

    .field input::placeholder {
      color: rgba(244,241,234,0.38);
    }

    .field input:focus,
    .field select:focus {
      border-color: rgba(128,210,234,0.55);
      box-shadow: 0 0 0 3px rgba(128,210,234,0.10);
    }

    .btn-clear {
      min-height: 52px;
      padding: 0 22px;
      border-radius: 14px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      transition: 0.25s ease;
    }

    .btn-clear:hover {
      border-color: var(--border-strong);
      background: rgba(255,255,255,0.03);
    }

    .library-preview {
      padding: 30px 0 86px;
    }

    .library-row + .library-row {
      margin-top: 34px;
    }

    .library-row__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .library-row__header h2 {
      margin: 0;
      font-size: clamp(1.08rem, 2vw, 1.45rem);
      letter-spacing: -0.02em;
      font-weight: 600;
      color: var(--text);
    }

    .library-row__track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x proximity;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.16) transparent;
    }

    .library-row__track::-webkit-scrollbar {
      height: 8px;
    }

    .library-row__track::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.16);
      border-radius: 999px;
    }

    .exercise-card {
      flex: 0 0 240px;
      min-width: 240px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      text-align: left;
      scroll-snap-align: start;
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }

    .exercise-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-strong);
      background: var(--surface-2);
    }

    .exercise-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #0f0f0f;
    }

    .exercise-card span {
      display: block;
      padding: 14px 14px 16px;
      color: var(--text);
      font-size: 0.98rem;
      font-weight: 500;
      line-height: 1.35;
    }

    .exercise-modal {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 9999;
    }

    .exercise-modal.is-open {
      display: block;
    }

    .exercise-modal__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.66);
      backdrop-filter: blur(8px);
    }

    .exercise-modal__panel {
      position: relative;
      width: min(1100px, calc(100% - 24px));
      max-height: calc(100dvh - 24px);
      margin: 12px auto;
      overflow: auto;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: #101010;
      box-shadow: 0 26px 80px rgba(0,0,0,0.4);
    }

    .exercise-modal__close {
      position: sticky;
      top: 14px;
      margin: 14px 14px 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1.6rem;
      z-index: 3;
    }

    .exercise-modal__content {
      padding: 8px 28px 28px;
    }

    .exercise-modal__content h3 {
      margin: 0 0 22px;
      font-size: clamp(1.4rem, 3vw, 2rem);
      line-height: 1.05;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    .exercise-modal__file {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #171717;
    }

    .exercise-modal__file iframe {
      width: 100%;
      height: 430px;
      border: 0;
      display: block;
      background: #171717;
    }

    .exercise-modal__videos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 20px;
    }

    .exercise-modal__video-block p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 500;
    }

    .exercise-modal__video-block video {
      width: 100%;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: #000;
    }

    @media (max-width: 980px) {
      .search-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px) {
      .container {
        width: min(var(--max-width), calc(100% - 20px));
      }

      .hero-clean {
        padding: 62px 0 22px;
      }

      .search-panel {
        padding: 16px;
      }

      .search-grid {
        grid-template-columns: 1fr;
      }

      .exercise-card {
        flex: 0 0 210px;
        min-width: 210px;
      }

      .exercise-card img {
        height: 160px;
      }

      .exercise-modal__panel {
        width: calc(100% - 10px);
        max-height: calc(100dvh - 10px);
        margin: 5px auto;
        border-radius: 20px;
      }

      .exercise-modal__content {
        padding: 8px 16px 18px;
      }

      .exercise-modal__file iframe {
        height: 280px;
      }

      .exercise-modal__videos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero-clean">
      <div class="container">
        <div class="hero-clean__inner">
          <h1 class="hero-clean__title">KINISITECA</h1>
          <p class="hero-clean__subtitle">
            Biblioteca premium de ejercicios para fisioterapia, rehabilitación y rendimiento.
          </p>
        </div>

        <div class="search-panel">
          <div class="search-grid">
            <div class="field">
              <label for="searchInput">Buscar ejercicio</label>
              <input id="searchInput" type="text" placeholder="Ej. press banca, glúteo, tobillo..." />
            </div>

            <div class="field">
              <label for="filterMuscle">Músculo</label>
              <select id="filterMuscle">
                <option value="">Todos</option>
                <option>Pectoral</option>
                <option>Glúteo</option>
                <option>Tobillo</option>
                <option>Hombro</option>
                <option>Isquios</option>
                <option>Core</option>
              </select>
            </div>

            <button class="btn-clear" id="clearFilters">Limpiar</button>
          </div>
        </div>
      </div>
    </section>

    <section class="library-preview">
      <div class="container">

        <div class="library-row">
          <div class="library-row__header">
            <h2>Fuerza</h2>
          </div>

          <div class="library-row__track">
            <button class="exercise-card" onclick="openExerciseModal('Press banca', 'docs/press-banca.pdf', 'videos/press-banca-ia.mp4', 'videos/press-banca-real.mp4')">
              <img src="images/PB.png" alt="Press banca" loading="lazy">
              <span>Press banca</span>
            </button>

            <button class="exercise-card" onclick="openExerciseModal('Sentadilla Goblet', 'docs/sentadilla-goblet.pdf', 'videos/sentadilla-goblet-ia.mp4', 'videos/sentadilla-goblet-real.mp4')">
              <img src="images/sentadilla-goblet.jpg" alt="Sentadilla Goblet" loading="lazy">
              <span>Sentadilla Goblet</span>
            </button>

            <button class="exercise-card" onclick="openExerciseModal('Peso muerto rumano', 'docs/peso-muerto-rumano.pdf', 'videos/peso-muerto-rumano-ia.mp4', 'videos/peso-muerto-rumano-real.mp4')">
              <img src="images/peso-muerto-rumano.jpg" alt="Peso muerto rumano" loading="lazy">
              <span>Peso muerto rumano</span>
            </button>
          </div>
        </div>

        <div class="library-row">
          <div class="library-row__header">
            <h2>CrossFit</h2>
          </div>

          <div class="library-row__track">
            <button class="exercise-card" onclick="openExerciseModal('Thruster', 'docs/thruster.pdf', 'videos/thruster-ia.mp4', 'videos/thruster-real.mp4')">
              <img src="images/thruster.jpg" alt="Thruster" loading="lazy">
              <span>Thruster</span>
            </button>

            <button class="exercise-card" onclick="openExerciseModal('Wall Ball', 'docs/wall-ball.pdf', 'videos/wall-ball-ia.mp4', 'videos/wall-ball-real.mp4')">
              <img src="images/wall-ball.jpg" alt="Wall Ball" loading="lazy">
              <span>Wall Ball</span>
            </button>

            <button class="exercise-card" onclick="openExerciseModal('Burpee over bar', 'docs/burpee-over-bar.pdf', 'videos/burpee-over-bar-ia.mp4', 'videos/burpee-over-bar-real.mp4')">
              <img src="images/burpee-over-bar.jpg" alt="Burpee over bar" loading="lazy">
              <span>Burpee over bar</span>
            </button>
          </div>
        </div>

        <div class="library-row">
          <div class="library-row__header">
            <h2>Estiramientos</h2>
          </div>

          <div class="library-row__track">
            <button class="exercise-card" onclick="openExerciseModal('Estiramiento de isquios', 'docs/estiramiento-isquios.pdf', 'videos/estiramiento-isquios-ia.mp4', 'videos/estiramiento-isquios-real.mp4')">
              <img src="images/estiramiento-isquios.jpg" alt="Estiramiento de isquios" loading="lazy">
              <span>Estiramiento de isquios</span>
            </button>

            <button class="exercise-card" onclick="openExerciseModal('Movilidad torácica', 'docs/movilidad-toracica.pdf', 'videos/movilidad-toracica-ia.mp4', 'videos/movilidad-toracica-real.mp4')">
              <img src="images/movilidad-toracica.jpg" alt="Movilidad torácica" loading="lazy">
              <span>Movilidad torácica</span>
            </button>

            <button class="exercise-card" onclick="openExerciseModal('Estiramiento de psoas', 'docs/estiramiento-psoas.pdf', 'videos/estiramiento-psoas-ia.mp4', 'videos/estiramiento-psoas-real.mp4')">
              <img src="images/estiramiento-psoas.jpg" alt="Estiramiento de psoas" loading="lazy">
              <span>Estiramiento de psoas</span>
            </button>
          </div>
        </div>

        <div class="library-row">
          <div class="library-row__header">
            <h2>Recuperación</h2>
          </div>

          <div class="library-row__track">
            <button class="exercise-card" onclick="openExerciseModal('Liberación plantar', 'docs/liberacion-plantar.pdf', 'videos/liberacion-plantar-ia.mp4', 'videos/liberacion-plantar-real.mp4')">
              <img src="images/liberacion-plantar.jpg" alt="Liberación plantar" loading="lazy">
              <span>Liberación plantar</span>
            </button>

            <button class="exercise-card" onclick="openExerciseModal('Trabajo de tobillo', 'docs/trabajo-tobillo.pdf', 'videos/trabajo-tobillo-ia.mp4', 'videos/trabajo-tobillo-real.mp4')">
              <img src="images/trabajo-tobillo.jpg" alt="Trabajo de tobillo" loading="lazy">
              <span>Trabajo de tobillo</span>
            </button>

            <button class="exercise-card" onclick="openExerciseModal('Descarga de gemelo', 'docs/descarga-gemelo.pdf', 'videos/descarga-gemelo-ia.mp4', 'videos/descarga-gemelo-real.mp4')">
              <img src="images/descarga-gemelo.jpg" alt="Descarga de gemelo" loading="lazy">
              <span>Descarga de gemelo</span>
            </button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div class="exercise-modal" id="exerciseModal" aria-hidden="true">
    <div class="exercise-modal__backdrop" onclick="closeExerciseModal()"></div>

    <div class="exercise-modal__panel" role="dialog" aria-modal="true" aria-labelledby="exerciseModalTitle">
      <button class="exercise-modal__close" onclick="closeExerciseModal()" aria-label="Cerrar modal">×</button>

      <div class="exercise-modal__content">
        <h3 id="exerciseModalTitle">Ejercicio</h3>

        <div class="exercise-modal__file">
          <iframe id="exerciseFile" src="" title="Archivo del ejercicio"></iframe>
        </div>

        <div class="exercise-modal__videos">
          <div class="exercise-modal__video-block">
            <p>Vídeo IA</p>
            <video id="exerciseVideoAI" controls playsinline>
              <source src="" type="video/mp4">
            </video>
          </div>

          <div class="exercise-modal__video-block">
            <p>Vídeo real</p>
            <video id="exerciseVideoReal" controls playsinline>
              <source src="" type="video/mp4">
            </video>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function openExerciseModal(title, fileUrl, aiVideoUrl, realVideoUrl) {
      const modal = document.getElementById('exerciseModal');
      const titleEl = document.getElementById('exerciseModalTitle');
      const fileEl = document.getElementById('exerciseFile');
      const aiVideo = document.getElementById('exerciseVideoAI');
      const realVideo = document.getElementById('exerciseVideoReal');

      titleEl.textContent = title;
      fileEl.src = fileUrl;

      aiVideo.querySelector('source').src = aiVideoUrl;
      aiVideo.load();

      realVideo.querySelector('source').src = realVideoUrl;
      realVideo.load();

      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeExerciseModal() {
      const modal = document.getElementById('exerciseModal');
      const fileEl = document.getElementById('exerciseFile');
      const aiVideo = document.getElementById('exerciseVideoAI');
      const realVideo = document.getElementById('exerciseVideoReal');

      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';

      fileEl.src = '';

      aiVideo.pause();
      realVideo.pause();

      aiVideo.querySelector('source').src = '';
      realVideo.querySelector('source').src = '';

      aiVideo.load();
      realVideo.load();
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeExerciseModal();
      }
    });

    const searchInput = document.getElementById('searchInput');
    const filterMuscle = document.getElementById('filterMuscle');
    const clearFilters = document.getElementById('clearFilters');

    clearFilters.addEventListener('click', function() {
      searchInput.value = '';
      filterMuscle.value = '';
    });
  </script>
</body>
</html>
