<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recovery | Acceso clínica</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0a0a;--surface:#111;--surface2:#181818;--surface3:#202020;--border:#2b2b2b;--text:#f5f5f5;--muted:#a6a6a6;--danger:#ffd7d7;--radius:22px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;display:grid;place-items:center;padding:1rem}.wrap{width:min(680px,100%);display:grid;gap:1rem}.brand{text-align:center;color:var(--muted);font-size:.9rem;letter-spacing:.12em;text-transform:uppercase}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;display:grid;gap:1rem}.card h1{margin:0;font-size:clamp(1.5rem,4vw,2.2rem)}.card h2{margin:0;font-size:1.35rem}.copy{color:var(--muted);margin:0}.field{display:grid;gap:.45rem}.field label{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.field input,.compose textarea{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:14px;padding:1rem;outline:none}.btn{min-height:44px;border-radius:999px;padding:.8rem 1rem;border:1px solid var(--border);background:#fff;color:#000;font-weight:700;cursor:pointer}.btn-secondary{background:transparent;color:var(--text)}.status{display:none;padding:.9rem 1rem;border-radius:14px;border:1px solid var(--border)}.status.show{display:block}.status.error{color:var(--danger);background:rgba(255,215,215,.08)}.chat{display:none}.chat.open{display:grid}.messages{min-height:280px;max-height:50vh;overflow:auto;display:grid;align-content:start;gap:.65rem;padding:.5rem 0}.bubble{max-width:82%;padding:.75rem .9rem;border-radius:15px;background:var(--surface3)}.bubble.clinic{justify-self:end;background:#fff;color:#000}.compose{display:grid;gap:.7rem}.compose textarea{min-height:90px;resize:vertical}.chat-top{display:flex;justify-content:space-between;gap:1rem;align-items:start}.logout{font-size:.85rem;color:var(--muted);background:none;border:0;cursor:pointer}.video{border:1px solid var(--border);background:var(--surface2);border-radius:15px;padding:1rem;display:grid;gap:.35rem}.video small{color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">Recovery</div>
<section class="card" id="accessCard">
<h1>Accede como clínica</h1>
<p class="copy">Introduce las credenciales proporcionadas por Recovery.</p>
<div id="accessStatus" class="status"></div>
<div class="field"><label for="clinicCode">Código de clínica</label><input id="clinicCode" placeholder="CLINIC-XXXXXXXXXXXX" autocomplete="one-time-code" /></div>
<button class="btn" id="accessButton">Acceder</button>
</section>
<section class="card chat" id="chatCard">
<div class="chat-top"><div><h2 id="clinicName">Chat con paciente</h2><p class="copy" id="patientName">Recovery</p></div><button class="logout" id="exitButton">Salir</button></div>
<div class="messages" id="messages"><div class="bubble">Este espacio está preparado para conversar con tus pacientes.</div></div>
<div class="compose"><textarea id="messageInput" placeholder="Escribe una respuesta..."></textarea><button class="btn" id="sendButton">Enviar mensaje</button></div>
<div><h2>Vídeos enviados</h2><div id="videos"><p class="copy">Todavía no hay vídeos enviados.</p></div></div>
</section>
</main>
<script>
const SUPABASE_URL='https://yvkamsbqysxgqycrklkk.supabase.co';
const SUPABASE_KEY='sb_publishable_ad6mFCc8LZN3Ua1yEgMwIA_moH8Ekzk';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let currentClinic=null;
function status(text,type='error'){const el=$('accessStatus');el.textContent=text;el.className='status show '+type}
function clearStatus(){$('accessStatus').className='status'}
async function access(){clearStatus();const code=$('clinicCode').value.trim().toUpperCase();if(!code){status('Introduce el código de clínica.');return}const {data,error}=await supabaseClient.rpc('validate_clinic_access_code',{p_code:code});if(error){status(error.message);return}const clinic=Array.isArray(data)?data[0]:data;if(!clinic){status('Código incorrecto, caducado o revocado.');return}currentClinic=clinic;$('accessCard').style.display='none';$('chatCard').classList.add('open');$('clinicName').textContent='Chat con '+clinic.clinic_name;$('messages').innerHTML='<div class="bubble">Este espacio está preparado para conversar con tus pacientes.</div>'}
async function sendMessage(){if(!currentClinic)return;const text=$('messageInput').value.trim();if(!text)return;const bubble=document.createElement('div');bubble.className='bubble clinic';bubble.textContent=text;$('messages').appendChild(bubble);$('messageInput').value=''}
$('accessButton').addEventListener('click',access);$('clinicCode').addEventListener('keydown',e=>{if(e.key==='Enter')access()});$('sendButton').addEventListener('click',sendMessage);$('exitButton').addEventListener('click',()=>{currentClinic=null;$('chatCard').classList.remove('open');$('accessCard').style.display='grid';$('clinicCode').value='';clearStatus()});
</script>
</body>
</html>
